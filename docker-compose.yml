services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bicoja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bicoja_dev_local}
      POSTGRES_DB: bicoja_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bicoja -d bicoja_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: bicoja
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bicoja_dev_local}
      DB_NAME: bicoja_db
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
